<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Integrations — Stackly Dashboard | No-Code App Builder</title>
  <meta name="description" content="Connect and manage integrations for your Stackly workspace — Google, Slack, Stripe, Zapier, webhooks, and more.">
  <meta property="og:title" content="Integrations — Stackly Dashboard">
  <meta property="og:description" content="Connect payments, messaging, data, and automation to your apps.">
  <meta property="og:type" content="website">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%237928AB'/%3E%3Cstop offset='1' stop-color='%239A289C'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='24' height='24' rx='6' fill='url(%23g)'/%3E%3Cpath d='M13 5 6.5 13H11l-.8 6L17 11h-4.5L13 5z' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Outfit:wght@600;700;800&family=Poppins:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/variables.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/forms.css">
  <link rel="stylesheet" href="assets/css/animations.css">
  <link rel="stylesheet" href="assets/css/dashboard.css">
  <link rel="stylesheet" href="assets/css/utilities.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
  <script src="assets/js/darkmode.js"></script>
</head>
<body data-dash="integrations">
  <div class="dash-layout">
    <aside id="dash-sidebar" aria-label="Dashboard navigation"></aside>
    <div class="dash-main">
      <header id="dash-topbar"></header>
      <main id="main" class="dash-content dash-section-gap">

        <section aria-label="Integration summary">
          <div class="dash-head-row">
            <div>
              <h2>Integrations</h2>
              <p class="sub">Connect your apps to the tools your business already runs on.</p>
            </div>
            <a class="btn btn-secondary" href="integrations.html"><i data-icon="external"></i> Browse catalog</a>
          </div>
          <div class="dash-row-3" id="int-stats"></div>
        </section>

        <section aria-label="Integration list">
          <div class="proj-toolbar">
            <label class="search-bar"><i data-icon="search"></i>
              <input type="search" id="int-search" placeholder="Search integrations…" aria-label="Search integrations">
            </label>
            <div class="filter-pills" id="int-pills"></div>
          </div>
          <div class="dash-row-3" id="int-grid"></div>
        </section>

      </main>
    </div>
  </div>

  <script src="assets/js/icons.js"></script>
  <script src="assets/js/artwork.js"></script>
  <script src="assets/js/storage.js"></script>
  <script src="assets/js/toast.js"></script>
  <script src="assets/js/modal.js"></script>
  <script src="assets/js/animations.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/dashboard.js"></script>
  <script>
  (function () {
    'use strict';
    if (!window.AppStore || !AppStore.auth.isLoggedIn()) return;

    var D = null;
    var state = { query: '', category: 'All' };

    var ICON_MAP = {
      'int-google': 'google', 'int-slack': 'chat', 'int-stripe': 'credit-card',
      'int-mailchimp': 'mail', 'int-shopify': 'cart', 'int-zapier': 'zap',
      'int-sheets': 'table', 'int-rest': 'code', 'int-webhooks': 'workflow', 'int-razor': 'dollar'
    };

    function list() { return AppStore.getIntegrations(); }

    function renderStats() {
      var all = list();
      var connected = all.filter(function (i) { return i.connected; }).length;
      var host = document.getElementById('int-stats');
      var cards = [
        { icon: 'check-circle', tint: 'tint-green', value: connected, label: 'Connected integrations' },
        { icon: 'cloud', tint: 'tint-purple', value: all.length - connected, label: 'Available to connect' },
        { icon: 'workflow', tint: 'tint-blue', value: '1.2k', label: 'Webhook events this week' }
      ];
      host.innerHTML = cards.map(function (c) {
        return '<article class="card dash-stat"><div class="dash-stat-top">' +
          '<span class="stat-icon ' + c.tint + '"><i data-icon="' + c.icon + '"></i></span></div>' +
          '<div class="stat-value">' + c.value + '</div><div class="stat-label">' + c.label + '</div></article>';
      }).join('');
      window.Icons.inject(host);
    }

    function renderPills() {
      var cats = ['All'];
      list().forEach(function (i) { if (cats.indexOf(i.category) === -1) cats.push(i.category); });
      var host = document.getElementById('int-pills');
      host.innerHTML = cats.map(function (c) {
        return '<button class="pill' + (c === state.category ? ' is-active' : '') + '" type="button" data-cat="' + c + '">' + c + '</button>';
      }).join('');
    }

    function renderGrid() {
      var host = document.getElementById('int-grid');
      var q = state.query.toLowerCase();
      var items = list().filter(function (i) {
        if (state.category !== 'All' && i.category !== state.category) return false;
        if (q && (i.name + ' ' + i.desc + ' ' + i.category).toLowerCase().indexOf(q) === -1) return false;
        return true;
      });

      if (!items.length) {
        host.innerHTML = '<div class="card" style="grid-column:1/-1"><div class="empty-state">' +
          '<div class="empty-icon"><i data-icon="search"></i></div><h3>No integrations match</h3>' +
          '<p>Try a different search or category.</p></div></div>';
        window.Icons.inject(host);
        return;
      }

      host.innerHTML = items.map(function (i) {
        var icon = ICON_MAP[i.id] || 'cloud';
        return '<article class="card int-card">' +
          '<div class="int-card-head">' +
            '<span class="int-logo" style="background:' + i.color + '"><i data-icon="' + icon + '"></i></span>' +
            '<span class="int-status ' + (i.connected ? 'is-on' : 'is-off') + '"><span class="badge-dot"></span>' + (i.connected ? 'Connected' : 'Not connected') + '</span>' +
          '</div>' +
          '<h3>' + D.esc(i.name) + '</h3>' +
          '<span class="badge badge-neutral">' + D.esc(i.category) + '</span>' +
          '<p class="int-desc">' + D.esc(i.desc) + '</p>' +
          '<div class="int-foot">' +
            (i.connected
              ? '<button class="btn btn-secondary btn-sm" type="button" data-configure="' + i.id + '"><i data-icon="settings"></i> Configure</button>' +
                '<button class="btn btn-ghost btn-sm" type="button" data-disconnect="' + i.id + '">Disconnect</button>'
              : '<button class="btn btn-primary btn-sm" type="button" data-connect="' + i.id + '"><i data-icon="plus"></i> Connect</button>') +
          '</div></article>';
      }).join('');
      window.Icons.inject(host);
    }

    function renderAll() { renderStats(); renderPills(); renderGrid(); }

    document.addEventListener('click', function (e) {
      var pill = e.target.closest('[data-cat]');
      if (pill) { state.category = pill.dataset.cat; renderPills(); renderGrid(); return; }

      var connect = e.target.closest('[data-connect]');
      if (connect) {
        var cid = connect.dataset.connect;
        connect.classList.add('is-loading');
        setTimeout(function () {
          AppStore.setIntegration(cid, true);
          var name = (list().find(function (i) { return i.id === cid; }) || {}).name || 'Integration';
          AppStore.logActivity({ type: 'edit', text: 'Connected ' + name + ' integration', icon: 'cloud' });
          window.Toast.success(name + ' is now connected to your workspace.', 'Connected');
          renderAll();
        }, 800);
        return;
      }

      var disc = e.target.closest('[data-disconnect]');
      if (disc) {
        var did = disc.dataset.disconnect;
        var dname = (list().find(function (i) { return i.id === did; }) || {}).name || 'Integration';
        window.Modal.confirm({
          title: 'Disconnect ' + dname + '?',
          message: 'Apps using this integration will stop syncing until you reconnect it.',
          okText: 'Disconnect',
          danger: true,
          onConfirm: function () {
            AppStore.setIntegration(did, false);
            window.Toast.info(dname + ' was disconnected.', 'Disconnected');
            renderAll();
          }
        });
        return;
      }

      var conf = e.target.closest('[data-configure]');
      if (conf) {
        var iid = conf.dataset.configure;
        var item = list().find(function (i) { return i.id === iid; }) || { name: 'Integration' };
        var backdrop = window.Modal.custom({
          title: 'Configure ' + item.name,
          bodyHTML:
            '<div class="form-group"><label class="form-label" for="cfg-key">API key</label>' +
            '<input class="form-control" id="cfg-key" type="password" value="sk_demo_9f8a7b6c5d4e3f2a1b0c" autocomplete="off"></div>' +
            '<div class="form-group"><label class="form-label" for="cfg-env">Environment</label>' +
            '<select class="form-control" id="cfg-env"><option>Production</option><option>Staging</option><option>Development</option></select></div>' +
            '<label class="switch"><input type="checkbox" checked><span class="switch-track"></span>' +
            '<span class="switch-label">Send events for all published apps</span></label>',
          footHTML:
            '<button class="btn btn-secondary" type="button" data-modal-close>Cancel</button>' +
            '<button class="btn btn-primary" type="button" data-cfg-save>Save settings</button>'
        });
        backdrop.querySelector('[data-cfg-save]').addEventListener('click', function () {
          window.Modal.close(backdrop);
          window.Toast.success(item.name + ' settings were saved.', 'Configured');
        });
      }
    });

    document.addEventListener('DOMContentLoaded', function () {
      D = window.DashShell;
      if (!D) return;
      document.getElementById('int-search').addEventListener('input', function () {
        state.query = this.value;
        renderGrid();
      });
      renderAll();
    });
  })();
  </script>
</body>
</html>
