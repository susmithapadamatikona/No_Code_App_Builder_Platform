  <style>
    /* ---- 404 page ---- */
    .nf-hero {
      position: relative;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      background: var(--gradient-hero);
      color: #E2E8F0;
      overflow: hidden;
      padding: calc(var(--navbar-h) + 40px) 20px 60px;
    }
    .nf-inner { position: relative; z-index: 2; max-width: 640px; margin-inline: auto; }
    .nf-code {
      font-family: var(--font-display);
      font-weight: 800;
      font-size: clamp(7rem, 22vw, 13rem);
      line-height: 0.95;
      letter-spacing: -0.04em;
      background: linear-gradient(120deg, #CF86C8 0%, #C084FC 45%, #38BDF8 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
      filter: drop-shadow(0 12px 40px rgba(154, 40, 156, 0.35));
    }
    .nf-hero h1 { color: #fff; font-size: clamp(1.4rem, 3vw, 2rem); letter-spacing: -0.02em; margin: var(--sp-3) 0; }
    .nf-hero > .nf-inner p.nf-sub { color: #94A3B8; font-size: var(--fs-md); max-width: 46ch; margin: 0 auto var(--sp-5); }
    .nf-search { max-width: 440px; margin: 0 auto var(--sp-5); }
    .nf-search .search-bar {
      height: 54px;
      background: rgba(255,255,255,0.08);
      border-color: rgba(255,255,255,0.18);
      backdrop-filter: blur(8px);
    }
    .nf-search .search-bar input { color: #fff; }
    .nf-search .search-bar input::placeholder { color: rgba(226,232,240,.55); }
    .nf-search .search-bar svg { color: rgba(226,232,240,.7); }
    .nf-float {
      position: absolute;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 18px;
      border-radius: 16px;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.12);
      backdrop-filter: blur(10px);
      box-shadow: 0 20px 50px rgba(2,6,23,0.4);
      color: #E2E8F0;
      font-size: var(--fs-sm);
      z-index: 1;
      animation: nf-drift 7s ease-in-out infinite;
    }
    .nf-float .fc-icon {
      width: 38px; height: 38px; border-radius: 11px;
      display: flex; align-items: center; justify-content: center;
      background: var(--gradient-primary); color: #fff; flex-shrink: 0;
    }
    .nf-float .fc-icon svg { width: 18px; height: 18px; }
    .nf-float b { display: block; font-size: var(--fs-sm); color: #fff; }
    .nf-float span span { font-size: var(--fs-xs); color: #94A3B8; }
    .nf-float--1 { top: 22%; left: 8%; animation-delay: 0s; }
    .nf-float--2 { top: 58%; right: 7%; animation-delay: 1.4s; }
    .nf-float--3 { bottom: 12%; left: 14%; animation-delay: 2.8s; }
    .nf-float--2 .fc-icon { background: linear-gradient(135deg, #F59E0B, #EF4444); }
    .nf-float--3 .fc-icon { background: linear-gradient(135deg, #10B981, #47C1D1); }
    @keyframes nf-drift {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-14px); }
    }
    @media (max-width: 900px) {
      .nf-float { display: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      .nf-float { animation: none; }
    }
  </style>
  <link rel="stylesheet" href="assets/css/utilities.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
  <script src="assets/js/darkmode.js"></script>

<body>

  <main id="main">
    <section class="nf-hero" aria-labelledby="nf-title">
      <div class="hero-bg" aria-hidden="true">
        <div class="hero-orb hero-orb--1"></div>
        <div class="hero-orb hero-orb--2"></div>
        <div class="hero-orb hero-orb--3"></div>
        <div class="hero-grid-lines"></div>
      </div>

      <!-- Floating glass cards -->
      <div class="nf-float nf-float--1" aria-hidden="true">
        <span class="fc-icon"><i data-icon="search"></i></span>
        <span><b>Page lookup</b><span>0 results found</span></span>
      </div>
      <div class="nf-float nf-float--2" aria-hidden="true">
        <span class="fc-icon"><i data-icon="alert-triangle"></i></span>
        <span><b>Error 404</b><span>Route not published</span></span>
      </div>
      <div class="nf-float nf-float--3" aria-hidden="true">
        <span class="fc-icon"><i data-icon="undo"></i></span>
        <span><b>Suggestion</b><span>Roll back to home</span></span>
      </div>

      <div class="nf-inner">
        <div class="nf-code" aria-hidden="true">404</div>
        <h1 id="nf-title">This page went no-code and disappeared</h1>
        <p class="nf-sub">Even our best workflow couldn't find the page you're looking for. It may have been moved, unpublished, or it never existed in the first place.</p>

        <div class="hero-cta" style="justify-content:center">
          <button class="btn btn-glass btn-lg" type="button" onclick="if(history.length>1){history.back();}else{window.location.href='index.html';}"><i data-icon="arrow-left"></i> Go Back</button>
          <a class="btn btn-primary btn-lg" href="index.html"><i data-icon="home"></i> Back to Home</a>
        </div>
      </div>
    </section>
  </main>

  <script src="assets/js/icons.js"></script>
  <script src="assets/js/artwork.js"></script>
  <script src="assets/js/storage.js"></script>
  <script src="assets/js/toast.js"></script>
  <script src="assets/js/modal.js"></script>
  <script src="assets/js/navbar.js"></script>
  <script src="assets/js/animations.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
