<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin · Templates — Stackly | No-Code App Builder</title>
  <meta name="description" content="Curate the Stackly template marketplace — add new templates, adjust pricing and tiers, edit listings, and control marketplace visibility.">
  <meta property="og:title" content="Admin · Templates — Stackly">
  <meta property="og:description" content="Template marketplace management for Stackly administrators.">
  <meta property="og:type" content="website">
  <meta name="robots" content="noindex">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%237928AB'/%3E%3Cstop offset='1' stop-color='%239A289C'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='24' height='24' rx='6' fill='url(%23g)'/%3E%3Cpath d='M13 5 6.5 13H11l-.8 6L17 11h-4.5L13 5z' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Outfit:wght@600;700;800&family=Poppins:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/variables.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/forms.css">
  <link rel="stylesheet" href="assets/css/animations.css">
  <link rel="stylesheet" href="assets/css/admin.css">
  <link rel="stylesheet" href="assets/css/utilities.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
  <script src="assets/js/darkmode.js"></script>
</head>
<body data-admin="templates">

  <div class="admin-layout">
    <aside id="admin-sidebar" aria-label="Admin navigation"></aside>
    <div class="admin-main">
      <header id="admin-topbar"></header>
      <main id="main" class="admin-content">

        <section aria-label="Template marketplace management">
          <div class="admin-toolbar">
            <div class="search-bar">
              <i data-icon="search"></i>
              <input type="search" id="tpl-search" placeholder="Search templates…" aria-label="Search templates">
            </div>
            <select class="form-control" id="tpl-cat" aria-label="Filter by category"></select>
            <div class="tabs" id="tpl-tier-tabs" role="tablist" aria-label="Filter by tier">
              <button type="button" class="tab-btn is-active" data-tier="all" role="tab" aria-selected="true">All<span class="tab-count" id="tcount-all">0</span></button>
              <button type="button" class="tab-btn" data-tier="free" role="tab" aria-selected="false">Free<span class="tab-count" id="tcount-free">0</span></button>
              <button type="button" class="tab-btn" data-tier="premium" role="tab" aria-selected="false">Premium<span class="tab-count" id="tcount-premium">0</span></button>
            </div>
            <div class="toolbar-spacer"></div>
            <button type="button" class="btn btn-primary" id="tpl-add"><i data-icon="plus"></i>Add template</button>
          </div>

          <p class="table-foot-info" style="margin-bottom:14px">Changes here publish straight to the marketplace that customers browse.</p>

          <div class="tpl-admin-grid" id="templates-grid" aria-live="polite"></div>
        </section>

      </main>
    </div>
  </div>

  <script src="assets/js/icons.js"></script>
  <script src="assets/js/artwork.js"></script>
  <script src="assets/js/storage.js"></script>
  <script src="assets/js/toast.js"></script>
  <script src="assets/js/modal.js"></script>
  <script src="assets/js/validation.js"></script>
  <script src="assets/js/animations.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/admin.js"></script>
</body>
</html>
