<body data-admin="categories">

  <div class="admin-layout">
    <aside id="admin-sidebar" aria-label="Admin navigation"></aside>
    <div class="admin-main">
      <header id="admin-topbar"></header>
      <main id="main" class="admin-content">

        <section aria-label="Marketplace categories">
          <div class="admin-toolbar">
            <p class="table-foot-info" id="cat-total" style="margin:0"></p>
            <div class="toolbar-spacer"></div>
            <button type="button" class="btn btn-primary" id="cat-add"><i data-icon="plus"></i>Add category</button>
          </div>

          <p class="table-foot-info" style="margin-bottom:14px">Template counts recompute live from the marketplace. Use the arrows to control the order categories appear in filters.</p>

          <div class="cat-grid" id="categories-grid" aria-live="polite"></div>
        </section>

      </main>
    </div>
  </div>

  <script src="assets/js/icons.js"></script>
