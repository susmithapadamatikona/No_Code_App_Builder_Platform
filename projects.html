<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Projects — Stackly | No-Code App Builder</title>
  <meta name="description" content="Manage all your Stackly apps — search, filter, edit, duplicate, publish, share, and delete projects from one place.">
  <meta property="og:title" content="My Projects — Stackly">
  <meta property="og:description" content="Manage, publish, and share your no-code apps.">
  <meta property="og:type" content="website">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%237928AB'/%3E%3Cstop offset='1' stop-color='%239A289C'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='24' height='24' rx='6' fill='url(%23g)'/%3E%3Cpath d='M13 5 6.5 13H11l-.8 6L17 11h-4.5L13 5z' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Outfit:wght@600;700;800&family=Poppins:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/variables.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/forms.css">
  <link rel="stylesheet" href="assets/css/animations.css">
  <link rel="stylesheet" href="assets/css/dashboard.css">
  <link rel="stylesheet" href="assets/css/utilities.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
  <script src="assets/js/darkmode.js"></script>
</head>
<body data-dash="projects">
  <div class="dash-layout">
    <aside id="dash-sidebar" aria-label="Dashboard navigation"></aside>
    <div class="dash-main">
      <header id="dash-topbar"></header>
      <main id="main" class="dash-content dash-section-gap">

        <section aria-label="Project tools">
          <div class="dash-head-row">
            <div>
              <h2>My Projects</h2>
              <p class="sub" id="proj-count-sub">All the apps in your workspace.</p>
            </div>
            <button class="btn btn-primary" type="button" data-new-project><i data-icon="plus"></i> New App</button>
          </div>

          <div class="proj-toolbar">
            <label class="search-bar"><i data-icon="search"></i>
              <input type="search" id="proj-search" placeholder="Search projects…" aria-label="Search projects">
            </label>
            <div class="tabs" role="tablist" aria-label="Filter by status" id="status-tabs">
              <button class="tab-btn is-active" type="button" data-status="all">All <span data-count-all></span></button>
              <button class="tab-btn" type="button" data-status="published">Published <span data-count-published></span></button>
              <button class="tab-btn" type="button" data-status="draft">Drafts <span data-count-draft></span></button>
            </div>
            <span class="spacer"></span>
            <div class="view-toggle" role="group" aria-label="View mode">
              <button type="button" data-view="grid" aria-label="Grid view" data-tooltip="Grid view"><i data-icon="grid"></i></button>
              <button type="button" data-view="list" aria-label="List view" data-tooltip="List view"><i data-icon="menu"></i></button>
            </div>
          </div>

          <div id="proj-host"></div>
        </section>

      </main>
    </div>
  </div>

  <script src="assets/js/icons.js"></script>
  <script src="assets/js/artwork.js"></script>
  <script src="assets/js/storage.js"></script>
  <script src="assets/js/toast.js"></script>
  <script src="assets/js/modal.js"></script>
  <script src="assets/js/animations.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/dashboard.js"></script>
  <script>
  (function () {
    'use strict';
    if (!window.AppStore || !AppStore.auth.isLoggedIn()) return;

    var D = null; /* DashShell, resolved on DOMContentLoaded */
    var state = {
      query: '',
      status: 'all',
      view: AppStore.read('projects_view', 'grid')
    };

    function projects() { return AppStore.getProjects(); }

    function filtered() {
      var q = state.query.toLowerCase();
      return projects().filter(function (p) {
        if (state.status !== 'all' && p.status !== state.status) return false;
        if (q && (p.name + ' ' + p.template).toLowerCase().indexOf(q) === -1) return false;
        return true;
      });
    }

    function menuHTML(p) {
      return '<div class="card-menu">' +
        '<button class="btn btn-icon" type="button" data-menu-toggle aria-haspopup="true" aria-label="More actions for ' + D.esc(p.name) + '">' +
          '<i data-icon="settings"></i></button>' +
        '<div class="menu-pop drop-down" role="menu">' +
          '<button type="button" data-act="duplicate" data-id="' + p.id + '"><i data-icon="copy"></i> Duplicate</button>' +
          '<button type="button" data-act="share" data-id="' + p.id + '"><i data-icon="share"></i> Share</button>' +
          '<button type="button" data-act="toggle-publish" data-id="' + p.id + '"><i data-icon="' + (p.status === 'published' ? 'lock' : 'rocket') + '"></i> ' +
            (p.status === 'published' ? 'Unpublish' : 'Publish') + '</button>' +
          '<div class="menu-divider"></div>' +
          '<button class="is-danger" type="button" data-act="delete" data-id="' + p.id + '"><i data-icon="trash"></i> Delete</button>' +
        '</div></div>';
    }

    function gridCard(p) {
      return '<article class="proj-card">' +
        '<a class="proj-card-thumb" href="project-details.html?id=' + p.id + '" style="' + D.gradientCSS(p.gradient) + '" aria-label="Open ' + D.esc(p.name) + '">' +
          D.artFor(p) + D.statusBadge(p.status) + '</a>' +
        '<div class="proj-card-body">' +
          '<h3><a href="project-details.html?id=' + p.id + '">' + D.esc(p.name) + '</a></h3>' +
          '<span class="tpl-origin">From ' + D.esc(p.template) + '</span>' +
          '<div class="proj-card-meta">' +
            '<span><i data-icon="eye"></i> ' + D.fmtNum(p.views) + '</span>' +
            '<span><i data-icon="layers"></i> ' + p.pages + ' pages</span>' +
            '<span><i data-icon="clock"></i> ' + D.fmtDate(p.modified) + '</span>' +
          '</div></div>' +
        '<div class="proj-card-actions">' +
          '<a class="btn btn-primary btn-sm" href="app-builder.html?project=' + p.id + '"><i data-icon="edit"></i> Edit</a>' +
          '<a class="btn btn-secondary btn-sm" href="project-details.html?id=' + p.id + '"><i data-icon="eye"></i> Preview</a>' +
          menuHTML(p) +
        '</div></article>';
    }

    function listRow(p) {
      return '<tr>' +
        '<td><div class="proj-cell"><span class="proj-thumb" style="' + D.gradientCSS(p.gradient) + '">' + D.thumbSVG() + '</span>' +
          '<div><a class="cell-strong" href="project-details.html?id=' + p.id + '">' + D.esc(p.name) + '</a>' +
          '<div class="text-xs text-muted-c">From ' + D.esc(p.template) + '</div></div></div></td>' +
        '<td>' + D.statusBadge(p.status) + '</td>' +
        '<td>' + D.fmtNum(p.views) + '</td>' +
        '<td>' + p.pages + '</td>' +
        '<td>' + D.fmtDate(p.created) + '</td>' +
        '<td>' + D.fmtDate(p.modified) + '</td>' +
        '<td><div class="table-actions">' +
          '<a class="btn btn-icon" href="app-builder.html?project=' + p.id + '" aria-label="Edit" data-tooltip="Edit"><i data-icon="edit"></i></a>' +
          '<a class="btn btn-icon" href="project-details.html?id=' + p.id + '" aria-label="Details" data-tooltip="Details"><i data-icon="eye"></i></a>' +
          menuHTML(p) +
        '</div></td></tr>';
    }

    function render() {
      var host = document.getElementById('proj-host');
      var list = filtered();
      var all = projects();

      /* counts + sub */
      document.querySelector('[data-count-all]').textContent = '(' + all.length + ')';
      document.querySelector('[data-count-published]').textContent = '(' + all.filter(function (p) { return p.status === 'published'; }).length + ')';
      document.querySelector('[data-count-draft]').textContent = '(' + all.filter(function (p) { return p.status !== 'published'; }).length + ')';
      document.getElementById('proj-count-sub').textContent = 'Showing ' + list.length + ' of ' + all.length + ' apps in your workspace.';

      /* view toggle state */
      document.querySelectorAll('.view-toggle [data-view]').forEach(function (b) {
        b.classList.toggle('is-active', b.dataset.view === state.view);
      });

      if (!list.length) {
        host.innerHTML = '<div class="card"><div class="empty-state">' +
          '<div class="empty-icon"><i data-icon="layers"></i></div>' +
          '<h3>' + (all.length ? 'No projects match' : 'No projects yet') + '</h3>' +
          '<p>' + (all.length ? 'Try a different search or status filter.' : 'Create your first app from a template or a blank canvas.') + '</p>' +
          (all.length
            ? '<button class="btn btn-secondary" type="button" data-clear-filters>Clear filters</button>'
            : '<button class="btn btn-primary" type="button" data-new-project><i data-icon="plus"></i> Create New App</button>') +
          '</div></div>';
      } else if (state.view === 'grid') {
        host.innerHTML = '<div class="proj-grid">' + list.map(gridCard).join('') + '</div>';
      } else {
        host.innerHTML = '<div class="table-wrap"><table class="table">' +
          '<thead><tr><th>App</th><th>Status</th><th>Views</th><th>Pages</th><th>Created</th><th>Modified</th><th>Actions</th></tr></thead>' +
          '<tbody>' + list.map(listRow).join('') + '</tbody></table></div>';
      }
      window.Icons.inject(host);
    }

    function shareModal(p) {
      var url = 'https://' + (p.domain || (p.name.toLowerCase().replace(/[^a-z0-9]+/g, '-') + '.appflow.site'));
      var backdrop = window.Modal.custom({
        title: 'Share "' + p.name + '"',
        bodyHTML:
          '<p class="text-sm mb-4">Anyone with this link can view the ' + (p.status === 'published' ? 'live app' : 'latest preview') + '.</p>' +
          '<div class="d-flex gap-2"><input class="form-control" id="share-url" readonly value="' + url + '">' +
          '<button class="btn btn-secondary" type="button" data-copy-share style="flex-shrink:0"><i data-icon="copy"></i> Copy</button></div>',
        footHTML: '<button class="btn btn-primary" type="button" data-modal-close>Done</button>'
      });
      window.Icons.inject(backdrop);
      backdrop.querySelector('[data-copy-share]').addEventListener('click', function () {
        var input = backdrop.querySelector('#share-url');
        input.select();
        var copied = false;
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(input.value);
          copied = true;
        } else {
          try { copied = document.execCommand('copy'); } catch (e) { /* noop */ }
        }
        window.Toast[copied ? 'success' : 'info'](copied ? 'Link copied to clipboard.' : 'Select and copy the link manually.', 'Share');
      });
    }

    document.addEventListener('click', function (e) {
      /* kebab menus */
      var toggle = e.target.closest('[data-menu-toggle]');
      document.querySelectorAll('.card-menu.is-open').forEach(function (m) {
        if (toggle && m.contains(toggle)) return;
        m.classList.remove('is-open');
      });
      if (toggle) { toggle.closest('.card-menu').classList.toggle('is-open'); return; }

      if (e.target.closest('[data-clear-filters]')) {
        state.query = '';
        state.status = 'all';
        document.getElementById('proj-search').value = '';
        document.querySelectorAll('#status-tabs .tab-btn').forEach(function (b) {
          b.classList.toggle('is-active', b.dataset.status === 'all');
        });
        render();
        return;
      }

      var act = e.target.closest('[data-act]');
      if (!act) return;
      var id = act.dataset.id;
      var p = AppStore.getProject(id);
      if (!p) return;

      if (act.dataset.act === 'duplicate') {
        var copy = AppStore.duplicateProject(id);
        AppStore.logActivity({ type: 'create', text: 'Duplicated "' + p.name + '"', icon: 'copy' });
        window.Toast.success('"' + copy.name + '" was created as a draft.', 'Duplicated');
        render();
      } else if (act.dataset.act === 'share') {
        shareModal(p);
      } else if (act.dataset.act === 'toggle-publish') {
        var publishing = p.status !== 'published';
        AppStore.updateProject(id, {
          status: publishing ? 'published' : 'draft',
          domain: publishing ? (p.domain || p.name.toLowerCase().replace(/[^a-z0-9]+/g, '-') + '.appflow.site') : p.domain
        });
        AppStore.logActivity({ type: publishing ? 'publish' : 'edit', text: (publishing ? 'Published ' : 'Unpublished ') + '"' + p.name + '"', icon: publishing ? 'rocket' : 'lock' });
        window.Toast[publishing ? 'success' : 'info'](publishing ? '"' + p.name + '" is now live.' : '"' + p.name + '" was moved back to drafts.', publishing ? 'Published' : 'Unpublished');
        render();
      } else if (act.dataset.act === 'delete') {
        window.Modal.confirm({
          title: 'Delete "' + p.name + '"?',
          message: 'This permanently removes the app, its pages, and its builder layout. This cannot be undone.',
          okText: 'Delete app',
          danger: true,
          onConfirm: function () {
            AppStore.deleteProject(id);
            AppStore.remove('builder_' + id);
            AppStore.logActivity({ type: 'delete', text: 'Deleted "' + p.name + '"', icon: 'trash' });
            window.Toast.success('"' + p.name + '" was deleted.', 'Deleted');
            render();
          }
        });
      }
    });

    document.addEventListener('DOMContentLoaded', function () {
      D = window.DashShell;
      if (!D) return;

      document.getElementById('proj-search').addEventListener('input', function () {
        state.query = this.value;
        render();
      });

      document.querySelectorAll('#status-tabs .tab-btn').forEach(function (btn) {
        btn.addEventListener('click', function () {
          state.status = btn.dataset.status;
          document.querySelectorAll('#status-tabs .tab-btn').forEach(function (b) {
            b.classList.toggle('is-active', b === btn);
          });
          render();
        });
      });

      document.querySelectorAll('.view-toggle [data-view]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          state.view = btn.dataset.view;
          AppStore.write('projects_view', state.view);
          render();
        });
      });

      render();
    });
  })();
  </script>
</body>
</html>
